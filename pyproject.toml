[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-agent"
version = "0.2.0"
description = "Agentic LLM system that turns DeltaV FHX exports into Detailed Design Specification PDFs"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.83,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "scikit-learn>=1.4",
    "python-docx>=1.1",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
dds-agent = "dds_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dds_agent = ["knowledge/kb/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
